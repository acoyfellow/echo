name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run build:demo
      - run: bun run build:extension
      - run: bun run typecheck
      - run: bun test
      - run: bun run verify:extension-free
      - run: bun run verify:codemode
      - if: github.event_name == 'push'
        run: bun run verify:production
      - if: github.event_name == 'push'
        run: bun run verify:reviews
