<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Echo extension-free demo</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1118;color:#f7f9fb}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#3f2718 0,transparent 35%),#0b1118}.card{width:min(42rem,calc(100% - 3rem));padding:2rem;border:1px solid rgba(174,196,216,.14);border-radius:.7rem;background:#111a24}.eyebrow{font:600 .72rem monospace;letter-spacing:.18em;text-transform:uppercase;color:#f7b53b}h1{letter-spacing:-.03em}textarea{box-sizing:border-box;width:100%;min-height:9rem;padding:1rem;border:1px solid rgba(174,196,216,.2);border-radius:.45rem;background:#182431;color:#f7f9fb}button{padding:.7rem 1rem;border:0;border-radius:.45rem;font-weight:700;cursor:pointer}#connect{background:#f6821f;color:#0b1118}#stop{background:#ff7d68;color:#0b1118;margin-left:.5rem}button:disabled{opacity:.45;cursor:not-allowed}.state{margin:1rem 0;padding:1rem;background:#182431;border-radius:.45rem}code{font-family:"IBM Plex Mono",monospace;color:#71b8d8;overflow-wrap:anywhere}.muted{color:#9baaba}</style>
</head>
<body data-worker-base="">
  <main class="card">
    <div class="eyebrow">Echo live tab</div>
    <h1 id="title">Quarterly notes</h1>
    <p>This page exposes two actions: read this demo and update its draft. It does not expose approval or Stop.</p>
    <textarea id="draft">Initial draft</textarea>
    <div class="state">
      <strong id="status">Agent access stopped</strong>
      <p class="muted" id="activity">No agent activity</p>
      <code id="session"></code>
    </div>
    <button id="connect">Connect this tab</button>
    <button id="stop" disabled>Stop agent access</button>
  </main>
  <script defer src="/echo-demo.js?v=0.0.1.1"></script>
</body>
</html>
