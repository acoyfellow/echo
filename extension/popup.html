<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Echo Codemode</title>
  <style>
    body{width:340px;margin:0;padding:18px;background:#0b1118;color:#f7f9fb;font:14px/1.45 system-ui,sans-serif}h1{margin:0 0 10px;font-size:20px}.warning{padding:12px;border:1px solid #f6821f;border-radius:8px;background:#23180f}.muted{color:#aab6c2}select,button{box-sizing:border-box;width:100%;margin-top:12px;padding:10px;border:0;border-radius:7px}select{background:#182431;color:#f7f9fb}button{font-weight:700;cursor:pointer}#approve{background:#f6821f;color:#111}#stop{background:#ff7d68;color:#111}#copy{background:#314458;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}code{display:block;margin-top:10px;overflow-wrap:anywhere;color:#71b8d8}
  </style>
</head>
<body>
  <h1>Full page access</h1>
  <div class="warning">The agent can read and change anything this page’s JavaScript can access, including private app data, browser storage, and authenticated actions.</div>
  <p id="scope" class="muted">No tab approved.</p>
  <select id="tabs" aria-label="Tab to approve"></select>
  <button id="approve">Allow selected tab for 10 minutes</button>
  <button id="copy" disabled>Copy agent connection</button>
  <button id="stop" disabled>Stop and detach</button>
  <code id="receipt"></code>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
